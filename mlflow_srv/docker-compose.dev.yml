services:
  mlflow_db:
    image: postgres:15-alpine
    container_name: mlflow_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data

  mlflow_storage:
    image:                  minio/minio:latest
    container_name:         mlflow_storage
    restart:                always
    ports:
      - "5001:9000"
      - "5000:9001"
    command:                server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:      ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:  ${MINIO_ROOT_PASSWORD}
    volumes:
      - mlflow_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - minio.internal

  create_buckets:
    image: minio/mc:latest
    container_name: minio-client
    depends_on:
      mlflow_storage:
        condition: service_healthy
    network_mode: service:mlflow_storage
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://localhost:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      /usr/bin/mc mb myminio/mlflow --ignore-existing &&
      echo 'Bucket mlflow created successfully'
      "

  mlflow_server:
    image: ghcr.io/mlflow/mlflow:v3.12.0-full
    container_name: mlflow_server
    restart: always
    depends_on:
      mlflow_db:
        condition: service_started
      create_buckets:
        condition: service_completed_successfully
    ports:
      - "5100:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL:   "http://minio.internal:9000"
      AWS_ACCESS_KEY_ID:        ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY:    ${MINIO_ROOT_PASSWORD}
      AWS_S3_ADDRESSING_STYLE:  "path"
      MLFLOW_S3_IGNORE_TLS:     "true"
    command: >
      mlflow server 
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@mlflow_db:5432/${POSTGRES_DB} 
      --artifacts-destination s3://mlflow/
      --serve-artifacts
      --host 0.0.0.0

volumes:
  mlflow_db_data:
  mlflow_storage_data:
