service: "service:ChurnPredictionService"
name:    churn-prediction

labels:
  owner:        mlops
  project:      churn
  model_alias:  champion
  model_semver: "1.0.0"

# ── Files bundled into the Bento ──────────────────────────────────────────────
# model_artifacts/ được copy vào đây bởi scripts/build.sh trước khi build
include:
  - "service.py"
  - "model_artifacts/**"         # offline model + meta.json + code/

# ── Python dependencies ───────────────────────────────────────────────────────
python:
  requirements_txt: "requirements.txt"

# ── Docker image ──────────────────────────────────────────────────────────────
docker:
  base_image: "python:3.11-slim"

  env:
    # Service sẽ load model từ /app/model_artifacts (offline, không cần MLflow server)
    MODEL_ARTIFACTS_DIR:    "/app/model_artifacts"
    # Vẫn set để healthz trả về đúng thông tin
    MLFLOW_TRACKING_URI:    "http://mlflow:5100"
    MLFLOW_MODEL_URI:       "models:/Churn_Predict@champion"
    LOW_CONF_THRESHOLD:     "0.60"
    LOW_CONF_STREAK_LIMIT:  "200"

  # Cài thêm system deps cần cho một số ML libs
  system_packages:
    - libgomp1
    - curl
