apiVersion: 1

# ── Contact points ────────────────────────────────────────────────────────────
# Thay các email trong `addresses` bằng danh sách thực tế.
# SMTP được cấu hình qua biến môi trường GF_SMTP_* trong docker-compose.yml

contactPoints:
  - orgId: 1
    name:  mlops-email-alerts
    receivers:
      - uid:  mlops-email-receiver
        type: email
        settings:
          addresses: >-
            mlops-lead@company.com;
            data-scientist@company.com;
            platform-oncall@company.com
          subject: "[ALERT] Churn Model – Low Confidence Streak Triggered"
          message: |
            🚨 Churn Prediction Model Alert

            The model has produced {{ $values.A.Value | printf "%.0f" }} consecutive
            requests where ALL predictions had confidence score < 60%.

            This may indicate:
              • Data drift in incoming features
              • Model degradation requiring retraining
              • Upstream data pipeline issue

            ─────────────────────────────────────
            Metric   : churn_low_confidence_streak
            Threshold: 200 consecutive low-conf requests
            Fired at : {{ now | date "2006-01-02 15:04:05 UTC" }}
            ─────────────────────────────────────

            Please investigate via:
              • Grafana dashboard  : http://grafana:3001/d/churn-mlops
              • Evidently report   : http://evidently-monitor:8001/report/latest
              • MLflow experiments : http://mlflow:5100
        disableResolveMessage: false

# ── Notification policies ─────────────────────────────────────────────────────
policies:
  - orgId: 1
    receiver: mlops-email-alerts          # default policy
    groupBy: ["alertname", "service"]
    groupWait:      30s
    groupInterval:  5m
    repeatInterval: 4h                    # re-send every 4 h if still firing
    matchers:
      - label:    severity
        match:    =
        value:    critical

# ── Alert rules ───────────────────────────────────────────────────────────────
groups:
  - orgId:    1
    name:     churn-model-quality
    folder:   MLOps
    interval: 1m                          # evaluate every minute

    rules:

      # ── Rule 1: Low-confidence streak ──────────────────────────────────────
      - uid:     low-conf-streak-alert
        title:   "Low Confidence Streak ≥ 200"
        condition: A

        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: churn_low_confidence_streak
              instant: true
              intervalMs: 60000
              maxDataPoints: 1

        noDataState:  NoData
        execErrState: Alerting

        for: 0s      # fire immediately when condition is met (streak is cumulative)

        annotations:
          summary:     "Model confidence degradation detected"
          description: >
            {{ $values.A.Value }} consecutive prediction requests had confidence < 60%.
            Check for data drift or model staleness.

        labels:
          severity: critical
          team:     mlops
          service:  churn-prediction

        # Silence window: if alert fires, don't re-fire for 4 h (handled by repeatInterval above)

      # ── Rule 2: Evidently drift detected ───────────────────────────────────
      - uid:     evidently-drift-alert
        title:   "Evidently Dataset Drift Detected"
        condition: B

        data:
          - refId: B
            datasourceUid: prometheus
            model:
              expr: evidently_dataset_drift_detected
              instant: true
              intervalMs: 60000
              maxDataPoints: 1

        noDataState:  OK
        execErrState: Alerting
        for: 5m

        annotations:
          summary:     "Feature drift detected by Evidently"
          description: >
            Evidently AI has detected dataset drift in the current prediction window.
            Drift score: {{ $values.B.Value }}.

        labels:
          severity: warning
          team:     mlops
          service:  churn-prediction

      # ── Rule 3: Service down ────────────────────────────────────────────────
      - uid:     bentoml-down-alert
        title:   "Churn Prediction Service Down"
        condition: C

        data:
          - refId: C
            datasourceUid: prometheus
            model:
              expr: >
                absent(up{job="bentoml_churn"} == 1)
              instant: true
              intervalMs: 60000
              maxDataPoints: 1

        noDataState:  Alerting
        execErrState: Alerting
        for: 2m

        annotations:
          summary:     "BentoML service is not reachable"
          description: "Prometheus cannot scrape churn-prediction service for > 2 minutes."

        labels:
          severity: critical
          team:     mlops
          service:  churn-prediction
