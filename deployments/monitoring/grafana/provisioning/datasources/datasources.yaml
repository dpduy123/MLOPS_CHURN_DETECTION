apiVersion: 1

datasources:

  # ── Prometheus ───────────────────────────────────────────────────────────────
  - name:      Prometheus
    type:      prometheus
    uid:       prometheus
    url:       http://prometheus:9090
    access:    proxy
    isDefault: true
    jsonData:
      timeInterval: "15s"

  # ── Loki (logs) ──────────────────────────────────────────────────────────────
  - name:   Loki
    type:   loki
    uid:    loki
    url:    http://loki:3100
    access: proxy
    jsonData:
      maxLines: 1000

  # ── Tempo (tracing — optional) ────────────────────────────────────────────
  - name:   Tempo
    type:   tempo
    uid:    tempo
    url:    http://tempo:3200
    access: proxy
