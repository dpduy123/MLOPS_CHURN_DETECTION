server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Docker container logs via /var/lib/docker/containers ──────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host:             unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use container name as 'service' label
      - source_labels: [__meta_docker_container_name]
        regex:         "/(.*)"
        target_label:  service
      # Keep only churn-stack containers (filter by compose project label)
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex:         "deployments|churn.*"
        action:        keep
      # Extra labels
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label:  compose_service
    pipeline_stages:
      # Parse JSON log lines if possible
      - json:
          expressions:
            level:   level
            message: msg
      - labels:
          level:
      - output:
          source: message
