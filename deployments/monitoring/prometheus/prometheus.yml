global:
  scrape_interval:     15s
  evaluation_interval: 15s

# ── Alert rules files ──────────────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ── Alertmanager (không dùng – Grafana đảm nhiệm gửi email) ──────────────────
# alerting:
#   alertmanagers: []

# ── Scrape targets ────────────────────────────────────────────────────────────
scrape_configs:

  # BentoML Churn Prediction Service
  - job_name: "bentoml_churn"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["churn-prediction:3000"]
    relabel_configs:
      - target_label: service
        replacement:  churn-prediction

  # Evidently Monitor
  #- job_name: "evidently_monitor"
  #  metrics_path: "/metrics"
  #  static_configs:
  #    - targets: ["evidently-monitor:8001"]
  #  relabel_configs:
  #    - target_label: service
  #      replacement:  evidently-monitor

  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Grafana
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
